version: "3.8"

# =============================================================
# Life OS — Docker Compose Ecosystem
# =============================================================

services:

  # ----- PostgreSQL 16 -----
  postgres:
    image: postgres:16-alpine
    container_name: lifeos-postgres
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lifeos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----- pgAdmin 4 -----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lifeos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lifeos.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - lifeos-net
    depends_on:
      postgres:
        condition: service_healthy

  # ----- Spring Boot Backend (Commented out for local testing) -----
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: lifeos-backend
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: lifeos
  #     DB_USER: postgres
  #     DB_PASSWORD: postgres
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - lifeos-net
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # ----- Angular Frontend (Commented out for local testing) -----
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: lifeos-frontend
  #   ports:
  #     - "4200:80"
  #   networks:
  #     - lifeos-net
  #   depends_on:
  #     - backend

  # ----- Prometheus -----
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lifeos-prometheus
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - lifeos-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----- Grafana -----
  grafana:
    image: grafana/grafana:10.4.1
    container_name: lifeos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - lifeos-net
    depends_on:
      - prometheus

  # ----- Loki (Placeholder) -----
  # loki:
  #   image: grafana/loki:2.9.2
  #   container_name: lifeos-loki
  #   ports:
  #     - "3100:3100"
  #   networks:
  #     - lifeos-net

volumes:
  pgdata:
  pgadmin-data:
  prometheus-data:
  grafana-data:

networks:
  lifeos-net:
    driver: bridge
