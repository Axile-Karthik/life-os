# =============================================================
# Life OS — Shared Configuration (All Profiles)
# =============================================================
spring:
  application:
    name: life-os
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.lifeos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  cleanup:
    logs-retention-days: 7
    metrics-retention-days: 30
  storage:
    local-dir: ${LOCAL_STORAGE_DIR:uploads}

